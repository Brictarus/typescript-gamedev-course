name: Continuous Integration Gate

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24'
      use-cache:
        required: false
        type: boolean
        default: true
      run-eslint:
        required: false
        type: boolean
        default: true
      run-prettier:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: true

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      build_outcome: ${{ steps.build-step.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node (with cache)
        if: ${{ inputs.use-cache }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Node (no cache)
        if: ${{ !inputs.use-cache }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        if: ${{ inputs.run-eslint }}
        run: npm run lint:check

      - name: Run Prettier (check)
        if: ${{ inputs.run-prettier }}
        run: npm run prettier:check

      - name: Build (output in dist)
        if: ${{ inputs.run-build }}
        id: build-step
        run: npm run build
