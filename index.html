<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game-dev-vampire-survivors-clone</title>
  </head>
  <body>
    <div id="gameContainer">
      <canvas id="gameCanvas"></canvas>

      <div id="hud">
        <div id="timer">0:00</div>
        <div id="killCounter"></div>
        <div id="healthBarContainer">
          <div id="healthBarFill"></div>
        </div>
        <div id="missionBriefing">bla</div>
      </div>

      <div id="mainMenu" class="ui-panel">
        <h1>Game starter Kit</h1>
        <button data-action="start">Play</button>
        <div style="margin-top: 20px; font-size: 12px">
          <div>ZQSD - Move</div>
          <div>ESC - Pause</div>
        </div>
      </div>

      <div id="pauseMenu" class="ui-panel">
        <h2>PAUSED</h2>
        <button data-action="resume">RESUME</button>
        <button data-action="returnToMenu">QUIT TO MENU</button>
      </div>

      <div id="loadingScreen" class="ui-panel active">
        <h2>Loading...</h2>
        <p>Sharpening the pixels...</p>
      </div>

      <div id="gameOverMenu" class="ui-panel">
        <h1>Game Over</h1>
        <button data-action="start">Play Again</button>
        <button data-action="returnToMenu">Main Menu</button>
      </div>

      <div id="missionCompleteMenu" class="ui-panel">
        <h1>Mission Complete</h1>
        <button data-action="start">Play Again</button>
        <button data-action="returnToMenu">Main Menu</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
